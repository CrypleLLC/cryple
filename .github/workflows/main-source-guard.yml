name: main-source-guard
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions: {}

jobs:
  check-source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Require PRs into main to come from staging
        if: github.base_ref == 'main' && github.head_ref != 'staging'
        run: |
          echo "PRs into main must come from staging (got '${{ github.head_ref }}')."
          exit 1
